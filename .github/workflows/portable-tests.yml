name: Portable operations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operations:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock pytest==8.3.4 ruff==0.9.10
        shell: bash
      - run: python -m ruff check .
        shell: bash
      - run: python -m pytest -q
        shell: bash
